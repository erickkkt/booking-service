services:
  booking-api-postgres:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booking-service-api-postgres
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Provider: postgres
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=booking_service;Username=postgres;Password=postgres
      ConnectionStrings__SqlServer: Server=sqlserver,1433;Database=BookingService;User Id=sa;Password=Your_password123;TrustServerCertificate=True
      ConnectionStrings__ServiceBus: ${SERVICEBUS_CONNECTION_STRING:-}
      ServiceBus__TopicName: ${SERVICEBUS_TOPIC_NAME:-booking-events}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["postgres"]

  booking-api-sqlserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booking-service-api-sqlserver
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Provider: sqlserver
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=booking_service;Username=postgres;Password=postgres
      ConnectionStrings__SqlServer: Server=sqlserver,1433;Database=BookingService;User Id=sa;Password=Your_password123;TrustServerCertificate=True
      ConnectionStrings__ServiceBus: ${SERVICEBUS_CONNECTION_STRING:-}
      ServiceBus__TopicName: ${SERVICEBUS_TOPIC_NAME:-booking-events}
    depends_on:
      sqlserver:
        condition: service_started
    profiles: ["sqlserver"]

  postgres:
    image: postgres:16-alpine
    container_name: booking-service-postgres
    environment:
      POSTGRES_DB: booking_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booking_service"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles: ["postgres"]

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: booking-service-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    profiles: ["sqlserver"]

volumes:
  postgres_data:
  sqlserver_data:
